[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elios-colorizer"
version = "1.3.1"
description = "Local RGB projection onto Elios Inspector LAS point clouds"
readme = "README.md"
license = "MIT"
authors = [{ name = "Christian Herrman" }]
requires-python = ">=3.12,<3.15"
keywords = ["point-cloud", "LAS", "drone-inspection", "computer-vision", "Elios"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=2,<3", "scipy>=1.14,<2", "opencv-python-headless>=4.10,<5",
  "laspy[lazrs]>=2.5,<3", "PySide6-Essentials>=6.8,<7",
  "mcap>=1.3,<2", "mcap-ros2-support>=0.5.7,<0.6", "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7", "pillow>=11,<13"]

[project.gui-scripts]
elios-colorizer = "elios_colorizer.ui:main"

[project.scripts]
elios-colorizer-cli = "elios_colorizer.cli:main"

[project.urls]
Homepage = "https://github.com/echerrman/Elios-Colorizer"
Documentation = "https://github.com/echerrman/Elios-Colorizer/tree/main/docs"
Issues = "https://github.com/echerrman/Elios-Colorizer/issues"
Releases = "https://github.com/echerrman/Elios-Colorizer/releases"
Source = "https://github.com/echerrman/Elios-Colorizer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
