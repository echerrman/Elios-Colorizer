[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elios-colorizer"
version = "0.3.0"
description = "Local RGB projection onto Elios Inspector LAS point clouds"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2,<3", "scipy>=1.14,<2", "opencv-python-headless>=4.10,<5",
  "laspy[lazrs]>=2.5,<3", "PySide6-Essentials>=6.8,<7",
  "mcap>=1.3,<2", "mcap-ros2-support>=0.5.7,<0.6", "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7", "pillow>=11,<13"]

[project.gui-scripts]
elios-colorizer = "elios_colorizer.ui:main"

[project.scripts]
elios-colorizer-cli = "elios_colorizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
